services:
  db:
    image: postgres:16-alpine
    container_name: content-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-sync-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/content_sync
      SYNC_KEY: ${SYNC_KEY:-change-me}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
